<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Terminal</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Header -->
        <header class="header">
            <div class="logo">
                <div class="dot pulse"></div>
                <h1>Crypto Live <span>Terminal</span></h1>
            </div>
            <div class="controls">
                <button id="logs-btn" class="log-btn">View Logs</button>
                <label for="symbol-select">Market:</label>
                <select id="symbol-select">
                    <!-- Options populated via JS -->
                </select>
                <div class="status-indicator">
                    <span id="ws-status" class="status-badge disconnected">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Logs Modal -->
        <div id="logs-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Application Logs & Errors</h2>
                    <button id="close-logs" class="close-btn">&times;</button>
                </div>
                <div class="modal-body" id="logs-container">
                    <!-- Logs will appear here -->
                </div>
            </div>
        </div>

        <!-- Portfolio Dashboard -->
        <section class="portfolio-bar">
            <div class="portfolio-item">
                <span class="label">Total Value</span>
                <span class="value" id="port-total">$10,000.00</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Cash Balance</span>
                <span class="value" id="port-cash">$10,000.00</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Positions</span>
                <span class="value" id="port-positions">0 / 8</span>
            </div>
        </section>

        <!-- Main Chart Area -->
        <main class="main-content">
            <div class="chart-wrapper">
                <div class="chart-header">
                    <h2 id="current-symbol">Select a symbol</h2>
                    <div class="current-price" id="current-price">--</div>
                </div>
                <div id="tvchart" class="chart-container"></div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
