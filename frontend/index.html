<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity — Crypto Cockpit</title>
    <meta name="description" content="Antigravity Paper Trading Cockpit — Real-time crypto market analysis and simulated portfolio management">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230B0E14' stroke='%2300E5FF' stroke-width='2'/><text x='16' y='21' text-anchor='middle' fill='%2300E5FF' font-size='16' font-weight='bold'>A</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">
                <div class="dot pulse"></div>
                <h1>Antigravity <span>Cockpit</span></h1>
            </div>
            <div class="controls">
                <button id="logs-btn" class="log-btn">📋 Logs</button>
                <label for="symbol-select">Market:</label>
                <select id="symbol-select"></select>
                <span id="ws-status" class="status-badge disconnected">Offline</span>
            </div>
        </header>

        <!-- LOGS MODAL -->
        <div id="logs-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Application Logs & Errors</h2>
                    <button id="close-logs" class="close-btn">&times;</button>
                </div>
                <div class="modal-body" id="logs-container"></div>
            </div>
        </div>

        <!-- PORTFOLIO BAR -->
        <section class="portfolio-bar">
            <div class="portfolio-item">
                <span class="label">Total Value</span>
                <span class="value" id="port-total">$10,000.00</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Cash</span>
                <span class="value" id="port-cash">$10,000.00</span>
            </div>
            <div class="portfolio-item">
                <span class="label">P&L</span>
                <span class="value" id="port-pnl">$0.00</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Exposure</span>
                <span class="value" id="port-exposure">0.0%</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Positions</span>
                <span class="value" id="port-positions">0 / 8</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Drawdown</span>
                <span class="value" id="port-drawdown">0.0%</span>
            </div>
            <div class="portfolio-item">
                <span class="label">Bot</span>
                <span class="value" id="port-uptime" style="color: var(--up-color)">●  Active</span>
            </div>
        </section>

        <!-- MAIN COCKPIT GRID -->
        <div class="cockpit-grid">

            <!-- LEFT: Watchlist -->
            <div class="watchlist-panel">
                <div class="panel-title">Watchlist — By Score</div>
                <div id="watchlist-container">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- CENTER: Chart -->
            <div class="chart-area">
                <div class="chart-wrapper">
                    <div class="chart-header">
                        <h2 id="current-symbol">Select a symbol</h2>
                        <div class="current-price" id="current-price">--</div>
                    </div>
                    <div id="tvchart" class="chart-container"></div>
                </div>
            </div>

            <!-- RIGHT: Signal / Social Panel -->
            <div class="social-panel">
                <div class="panel-title">Signals & Sentiment</div>
                <div id="signals-container">
                    <!-- Populated by JS -->
                </div>
            </div>

        </div>

        <!-- BOTTOM: Activity Feed -->
        <div class="activity-feed">
            <div class="feed-header">
                <span class="panel-title">Activity & Decisions</span>
            </div>
            <div id="activity-container">
                <!-- Populated by JS -->
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
