name: ci

# Exécute la suite de tests offline (pytest) à côté du garde-fou docs-check.
# Les tests ne nécessitent ni DB ni réseau (voir CLAUDE.md « Tests »).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        env:
          PYTHONPATH: .
        run: pytest -q
