name: docs-check

# Vérifie qu'une PR touchant du code « important » met aussi à jour la doc.
# S'appuie sur scripts/check_docs_sync.py (stdlib only, pas de dépendances).

on:
  pull_request:
    branches: ["**"]

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history pour le merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Check documentation sync
        run: python scripts/check_docs_sync.py --base "origin/${{ github.base_ref }}"
